<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<title>Connect to server</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --ok-bg: #ecfdf5; --ok-text: #047857; --ok-border: #a7f3d0;
    --err-bg: #fef2f2; --err-text: #b91c1c; --err-border: #fecaca;
    --info-bg: #eff6ff; --info-text: #1e40af; --info-border: #bfdbfe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220;
      --card: #111a2e;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --ok-bg: #052e22; --ok-text: #6ee7b7; --ok-border: #065f46;
      --err-bg: #2a0f12; --err-text: #fca5a5; --err-border: #7f1d1d;
      --info-bg: #0c1a3a; --info-text: #93c5fd; --info-border: #1e3a8a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, .08);
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .brand svg { width: 44px; height: 44px; flex: none; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); margin: 2px 0 0; font-size: 13px; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 18px 0 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  button {
    margin-top: 18px;
    width: 100%;
    padding: 11px 16px;
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: .6; cursor: progress; }
  .status { margin-top: 16px; padding: 10px 12px; border-radius: 10px; font-size: 13.5px; border: 1px solid; display: none; white-space: pre-line; word-break: break-word; }
  .status.ok { display: block; background: var(--ok-bg); color: var(--ok-text); border-color: var(--ok-border); }
  .status.err { display: block; background: var(--err-bg); color: var(--err-text); border-color: var(--err-border); }
  .status.info { display: block; background: var(--info-bg); color: var(--info-text); border-color: var(--info-border); }
  .foot { margin-top: 20px; color: var(--muted); font-size: 12px; text-align: center; }
  code { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient></defs>
        <rect x="1" y="1" width="46" height="46" rx="11" fill="url(#g)"/>
        <g transform="translate(13.2 13.2) scale(1.2)" fill="#fff">
          <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z" transform="translate(-3 -3)"/>
        </g>
      </svg>
      <div>
        <h1>Connect to OpenDialer</h1>
        <p class="sub">Enter the address of your OpenDialer server.</p>
      </div>
    </div>

    <form id="form" autocomplete="on">
      <label for="url">Server address</label>
      <input id="url" name="url" type="text" inputmode="url" spellcheck="false" placeholder="https://localhost:8443" required>
      <div class="hint">
        Same computer: <code>https://localhost:8443</code><br>
        Office network: <code>https://192.168.x.x:8443</code> (shown when the server starts)<br>
        Internet: the https address your administrator gave you
      </div>
      <button id="connect" type="submit">Connect</button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>
    <p class="foot" id="foot">OpenDialer Desktop</p>
  </main>

<script>
  (function () {
    const params = new URLSearchParams(location.search);
    const input = document.getElementById('url');
    const button = document.getElementById('connect');
    const status = document.getElementById('status');
    const bridge = window.opendialerConnect;
    const desk = window.opendialerDesktop;

    input.value = params.get('url') || 'https://localhost:8443';
    if (desk && desk.version) document.getElementById('foot').textContent = 'OpenDialer Desktop ' + desk.version;

    function show(kind, text) {
      status.className = 'status ' + kind;
      status.textContent = text;
    }
    if (params.get('error')) show('err', params.get('error'));

    document.getElementById('form').addEventListener('submit', async function (e) {
      e.preventDefault();
      if (!bridge) { show('err', 'Desktop bridge not available.'); return; }
      button.disabled = true;
      show('info', 'Checking ' + input.value.trim() + ' …');
      try {
        const res = await bridge.check(input.value);
        if (!res || !res.ok) { show('err', (res && res.error) || 'Connection failed.'); return; }
        input.value = res.url;
        let msg = 'Connected: OpenDialer server v' + res.version + '.';
        if (res.certificateTrusted === false) msg += '\nThe server uses a self-signed certificate - you will be asked to trust it once.';
        if (res.url.indexOf('http://') === 0) msg += '\nNote: plain http. For the microphone, https is strongly recommended.';
        show('ok', msg + '\nOpening…');
        await new Promise(function (r) { setTimeout(r, 900); });
        const opened = await bridge.open(res.url);
        if (!opened || !opened.ok) show('err', (opened && opened.error) || 'Could not open the server.');
      } catch (err) {
        show('err', String((err && err.message) || err));
      } finally {
        button.disabled = false;
      }
    });
    input.focus();
    input.select();
  })();
</script>
</body>
</html>
